site_name: Night of the Meteor — Music tutorials
site_description: Community guide for contributing music to Night of the Meteor
site_author: Night of the Meteor team
site_url: https://selloa.github.io/nm-tutorials/

repo_name: nm-tutorials
repo_url: https://github.com/selloa/nm-tutorials
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: de
          name: Deutsch
          build: true
          site_name: Night of the Meteor — Musik-Tutorials
          site_description: Community-Leitfaden für Musikbeiträge zu Night of the Meteor
          theme:
            language: de
          nav_translations:
            Home: Startseite
            Technical setup: Technisches Setup
            Alternatives: Alternativen
            File formats & specs: Dateiformate & Spezifikationen
            Production pipeline: Produktionsablauf
            Glossary: Glossar
            Forum post (draft): Forenbeitrag (Entwurf)
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra_javascript:
  - assets/javascripts/language-redirect.js

nav:
  - Home: index.md
  - Technical setup: setup.md
  - Alternatives: alternatives.md
  - File formats & specs: formats.md
  - Production pipeline: pipeline.md
  - Glossary: glossary.md
  - Forum post (draft): forum-post-draft.md

extra:
  generator: false
