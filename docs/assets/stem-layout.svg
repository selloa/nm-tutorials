<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200" role="img" aria-label="Example stem layout from DAW to bounced files">
  <rect width="640" height="200" fill="#f5f5f5"/>
  <text x="320" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#333">Example: stems + reference mix (illustrative)</text>
  <rect x="40" y="50" width="120" height="110" rx="6" fill="#e8eaf6" stroke="#3949ab"/>
  <text x="100" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#1a237e">DAW session</text>
  <text x="100" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#333">tracks routed</text>
  <path d="M160 105 H200" stroke="#3949ab" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3949ab"/>
    </marker>
  </defs>
  <rect x="210" y="55" width="95" height="38" rx="4" fill="#fff" stroke="#5c6bc0"/>
  <text x="257" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#333">melody.wav</text>
  <rect x="210" y="100" width="95" height="38" rx="4" fill="#fff" stroke="#5c6bc0"/>
  <text x="257" y="123" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#333">harm.wav</text>
  <rect x="210" y="145" width="95" height="38" rx="4" fill="#fff" stroke="#5c6bc0"/>
  <text x="257" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#333">perc.wav</text>
  <path d="M305 105 H355" stroke="#3949ab" stroke-width="2" fill="none" marker-end="url(#arr2)"/>
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3949ab"/>
    </marker>
  </defs>
  <rect x="365" y="70" width="110" height="70" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="420" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1b5e20">mix ref</text>
  <text x="420" y="125" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#333">mix.ogg / mix.wav</text>
  <text x="520" y="115" font-family="system-ui,sans-serif" font-size="11" fill="#555">’ team / build</text>
</svg>
